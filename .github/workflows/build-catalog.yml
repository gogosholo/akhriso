name: Build catalog

on:
  push:
    branches: [main]
    paths:
      - catalog/books.json
      - catalog/curation.json
      - catalog/build_catalog.py
      - site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one build at a time, and a running publish is never cancelled.
concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test the script
        working-directory: catalog
        run: python -m unittest test_build_catalog.py

      # Keeps the books built by earlier runs, so a run only downloads and
      # rebuilds the books whose text or build script changed.
      - name: Restore earlier downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            catalog/output
            catalog/cache
          key: catalog-${{ github.run_id }}
          restore-keys: catalog-

      - name: Build catalog
        run: python catalog/build_catalog.py

      - name: Save downloads
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            catalog/output
            catalog/cache
          key: catalog-${{ github.run_id }}-${{ github.run_attempt }}

      # The app's privacy policy and support pages, which the App Store and
      # Google Play link to. Plain HTML with no scripts.
      - name: Add the static pages
        run: cp site/*.html catalog/output/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: catalog/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
